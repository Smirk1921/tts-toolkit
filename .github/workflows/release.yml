# release.yml — tag 触发发布链路
#
# 窗口 v8-1a（施工方案-v0.8.0 §四）：验证链路，只跑 build + test 3 连跑 + dry-run。
# 窗口 v8-0（施工方案-v0.8.0 §五）：启用真实 npm publish（去掉 --dry-run）。
# 红线 16：v0.7.0 必须成为第一个走本 workflow 的 npm 版本，不允许手动先发。
#
# 与 ci.yml 相同的故意约束：
# - 不设 TTS_FIXTURE_DIR / TTS_EXTRACTED_DIR（CI 基线 2024 passed / 82 skipped）
# - npm test 连跑 3 次防 Windows EBUSY
name: Release

on:
  push:
    tags:
      - 'v*'

env:
  CI: true

permissions:
  id-token: write  # npm provenance
  contents: read

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'

      # package.json 无 packageManager 字段，corepack 对 npm 无效；
      # 显式装 npm 11.9.0（Node 24.19.0 捆绑版本），保证 publish 行为可复现。
      - name: Pin npm
        run: npm install -g npm@11.9.0

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      # 跑满 3 次 npm test，最后一次必须过。
      # 不用 set -e：Windows 下已知 flaky test（cli-watch watcher 创建超时，
      # 见项目记忆 workflow-vitest-loop-pitfall）会让第 1/2 次偶发失败；
      # set -e 会让第 1 次失败就中止，3 连跑防御失效（v8-0 实测踩中）。
      # 判定：exit_code 记录每次结果，只有最后次失败才真 exit 1。
      - name: Test (3 consecutive runs, flaky-tolerant)
        shell: bash
        run: |
          last_exit=0
          for i in 1 2 3; do
            echo "=== npm test run $i/3 ==="
            if npm test; then
              echo "--- run $i: PASS ---"
              last_exit=0
            else
              rc=$?
              echo "--- run $i: FAIL (exit $rc) ---"
              last_exit=$rc
            fi
          done
          if [ "$last_exit" -ne 0 ]; then
            echo "::error::final npm test run failed (exit $last_exit)"
            exit "$last_exit"
          fi
          echo "=== final npm test run passed; flaky earlier runs tolerated ==="

      # v8-0：真实发布（NPM_TOKEN 走 GitHub Secrets，含 provenance 供应链证明）。
      - name: npm publish (real)
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
